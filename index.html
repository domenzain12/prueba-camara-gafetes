<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V10 Cámara</title><script src="https://unpkg.com/html5-qrcode"></script><style>body{font-family:Arial;background:#eee;margin:0}.w{max-width:650px;margin:auto;padding:16px}.h{background:#4b2e83;color:white;padding:20px;border-radius:15px;text-align:center}.c{background:white;padding:16px;border-radius:15px;margin-top:14px}#reader{background:#111;min-height:280px;border-radius:12px;overflow:hidden}button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:10px;font-weight:bold;font-size:16px}.p{background:#4b2e83;color:white}.s{background:#ddd}.r{text-align:center;border:2px solid #ddd;border-radius:12px;padding:18px}.ok{border-color:green;background:#eef8ef}#code{font-size:28px;font-weight:bold;color:#4b2e83;word-break:break-all;margin-top:8px}</style></head><body><div class="w"><div class="h"><b>V10 · PRUEBA DE CÁMARA</b><br><small>Escaneo directo fuera de Apps Script</small></div><div class="c"><div id="reader"></div><button class="p" id="start">📷 Iniciar cámara</button><button class="s" id="stop" disabled>Detener cámara</button><p id="status">No registra asistencias.</p></div><div class="c"><div class="r" id="res"><small>CÓDIGO DETECTADO</small><div id="code">—</div><small id="fmt"></small></div><p>Debe publicarse mediante <b>HTTPS</b>. Compara el resultado con la columna <b>CODIGO DE BARRAS</b>.</p></div></div><script>
let q,a=false,last="",t=0;
const fm=[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.CODE_93,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODABAR];
start.onclick=async()=>{if(a)return;q=new Html5Qrcode("reader",{formatsToSupport:fm});status.textContent="Solicitando cámara...";try{await q.start({facingMode:{ideal:"environment"}},{fps:15,qrbox:{width:300,height:130}},(x,r)=>{let n=Date.now();if(x===last&&n-t<1500)return;last=x;t=n;code.textContent=x;res.classList.add("ok");try{fmt.textContent="Formato: "+r.result.format.formatName}catch(e){}status.textContent="✓ Código detectado";if(navigator.vibrate)navigator.vibrate(100)},()=>{});a=true;start.disabled=true;stop.disabled=false;status.textContent="Cámara activa."}catch(e){status.textContent="Error de cámara: "+(e.message||e)}};
stop.onclick=async()=>{if(!a)return;try{await q.stop();q.clear()}catch(e){}a=false;start.disabled=false;stop.disabled=true;status.textContent="Cámara detenida."};
</script></body></html>
