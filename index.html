<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>V12 - Lector de código de barras</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f2f2;font-family:Arial,sans-serif;color:#252525}
.wrap{max-width:680px;margin:auto;padding:16px}
.head{background:#4b2e83;color:#fff;border-radius:16px;padding:20px;text-align:center}
.head h1{margin:0 0 6px;font-size:21px}
.head p{margin:0;font-size:13px;opacity:.9}
.card{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.video-wrap{position:relative;border-radius:12px;overflow:hidden;background:#111}
video{width:100%;min-height:280px;display:block;object-fit:cover;background:#111}
.scan-box{position:absolute;left:9%;right:9%;top:38%;height:24%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.28);pointer-events:none}
.scan-line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#fff;opacity:.9;pointer-events:none}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:11px;font-size:16px;font-weight:bold}
.primary{background:#4b2e83;color:#fff}
.secondary{background:#e2e2e2;color:#333}
.row{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.val{font-weight:bold}
.ok{color:#1b7f32}.bad{color:#b3261e}.warn{color:#9a6700}
.result{border:2px solid #ddd;border-radius:12px;padding:18px;text-align:center}
.result.okbox{border-color:#1b7f32;background:#eef8ef}
.label{font-size:12px;color:#666;font-weight:bold}
#codigo{font-size:30px;font-weight:bold;color:#4b2e83;word-break:break-all;margin-top:8px}
#formato{font-size:12px;color:#666;margin-top:7px}
#log{white-space:pre-wrap;background:#111;color:#eee;border-radius:10px;padding:12px;font-size:12px;min-height:100px}
.note{font-size:13px;line-height:1.45;color:#555}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>V12 · LECTOR DE CÓDIGO DE BARRAS</h1>
    <p>Cámara en tiempo real sobre la base V11 funcional</p>
  </div>

  <div class="card">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-box"></div>
      <div class="scan-line"></div>
    </div>
    <button id="btnStart" class="primary">📷 Iniciar lector</button>
    <button id="btnStop" class="secondary" disabled>Detener lector</button>
  </div>

  <div class="card">
    <div id="resultado" class="result">
      <div class="label">CÓDIGO DETECTADO</div>
      <div id="codigo">—</div>
      <div id="formato"></div>
    </div>
    <p class="note">Coloca únicamente el código de barras dentro del rectángulo. Esta V12 todavía no registra asistencias.</p>
  </div>

  <div class="card">
    <div class="row">HTTPS: <span id="https" class="val">—</span></div>
    <div class="row">BarcodeDetector: <span id="bd" class="val">—</span></div>
    <div class="row">Cámara: <span id="cam" class="val">DETENIDA</span></div>
  </div>

  <div class="card">
    <b>Diagnóstico</b>
    <div id="log">Página cargada.</div>
  </div>
</div>

<script>
(() => {
  const video = document.getElementById('video');
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const codigo = document.getElementById('codigo');
  const formato = document.getElementById('formato');
  const resultado = document.getElementById('resultado');
  const httpsEl = document.getElementById('https');
  const bdEl = document.getElementById('bd');
  const camEl = document.getElementById('cam');
  const log = document.getElementById('log');

  let stream = null;
  let detector = null;
  let activo = false;
  let rafId = null;
  let ultimoCodigo = '';
  let ultimaLectura = 0;
  let procesando = false;

  function setText(el, txt, cls='') {
    el.textContent = txt;
    el.className = 'val ' + cls;
  }

  function write(msg) {
    const t = new Date().toLocaleTimeString();
    log.textContent += '\n[' + t + '] ' + msg;
  }

  setText(httpsEl, window.isSecureContext ? 'SÍ' : 'NO', window.isSecureContext ? 'ok' : 'bad');

  const soportaBD = 'BarcodeDetector' in window;
  setText(bdEl, soportaBD ? 'DISPONIBLE' : 'NO DISPONIBLE', soportaBD ? 'ok' : 'bad');

  async function prepararDetector() {
    if (!soportaBD) {
      write('BarcodeDetector no está disponible en este navegador.');
      return false;
    }

    let soportados = [];
    try {
      soportados = await BarcodeDetector.getSupportedFormats();
      write('Formatos soportados: ' + soportados.join(', '));
    } catch (e) {
      write('No se pudieron consultar formatos: ' + e.message);
    }

    const preferidos = [
      'code_128','code_39','code_93','ean_13','ean_8',
      'itf','upc_a','upc_e','codabar'
    ];
    const formatos = soportados.length ? preferidos.filter(f => soportados.includes(f)) : preferidos;

    try {
      detector = new BarcodeDetector({ formats: formatos.length ? formatos : undefined });
      write('Detector preparado.');
      return true;
    } catch (e) {
      write('Error creando detector: ' + e.name + ' - ' + e.message);
      return false;
    }
  }

  async function iniciar() {
    write('Botón Iniciar lector pulsado.');

    if (!window.isSecureContext) {
      write('ERROR: la página no está en contexto HTTPS seguro.');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      write('ERROR: getUserMedia no disponible.');
      return;
    }

    const ok = await prepararDetector();
    if (!ok) return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: 'environment' },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      activo = true;
      btnStart.disabled = true;
      btnStop.disabled = false;
      setText(camEl, 'ACTIVA', 'ok');
      write('Cámara abierta. Iniciando detección.');
      detectarLoop();
    } catch (e) {
      setText(camEl, 'ERROR', 'bad');
      write('ERROR cámara: ' + e.name + ' - ' + e.message);
    }
  }

  async function detectarLoop() {
    if (!activo) return;

    if (!procesando && video.readyState >= 2) {
      procesando = true;
      try {
        const codes = await detector.detect(video);
        if (codes && codes.length) {
          const code = codes[0];
          const value = String(code.rawValue || '').trim();
          const now = Date.now();

          if (value && (value !== ultimoCodigo || (now - ultimaLectura) > 1800)) {
            ultimoCodigo = value;
            ultimaLectura = now;
            codigo.textContent = value;
            formato.textContent = code.format ? 'Formato: ' + code.format : '';
            resultado.classList.add('okbox');
            write('Código detectado: ' + value + (code.format ? ' [' + code.format + ']' : ''));
            if (navigator.vibrate) navigator.vibrate(120);
          }
        }
      } catch (e) {
        if (activo) write('Error de detección: ' + e.name + ' - ' + e.message);
      } finally {
        procesando = false;
      }
    }

    rafId = requestAnimationFrame(detectarLoop);
  }

  function detener() {
    activo = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    video.srcObject = null;
    btnStart.disabled = false;
    btnStop.disabled = true;
    setText(camEl, 'DETENIDA', 'warn');
    write('Lector detenido.');
  }

  btnStart.addEventListener('click', iniciar);
  btnStop.addEventListener('click', detener);
})();
</script>
</body>
</html>
